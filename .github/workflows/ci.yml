name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag that can be moved. Dependabot proposes the updates.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # A deployed copy has its own IDs in wrangler.jsonc; only the source repository must stay neutral.
      - if: github.repository == 'alexlmiller/lab-trends'
        run: npm run check:neutral
