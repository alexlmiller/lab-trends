name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag that can be moved. Dependabot proposes the updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # A deployed copy has its own IDs in wrangler.jsonc; only the source repository must stay neutral.
      - if: github.repository == 'alexlmiller/lab-trends'
        run: npm run check:neutral
