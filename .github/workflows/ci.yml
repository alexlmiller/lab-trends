name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # A deployed copy has its own IDs in wrangler.jsonc; only the source repository must stay neutral.
      - if: github.repository == 'alexlmiller/lab-trends'
        run: npm run check:neutral
